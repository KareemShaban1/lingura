# LinguaForge on ONE aaPanel website (site root: <repo>/backend/public).
# Paste into: Website → your site → Settings → URL rewrite (replace anything already there).
# Laravel answers /api, /sanctum, /horizon and /up; every other path goes to the Next.js server on port 3000.
# Check the PHP socket in /www/server/nginx/conf/enable-php-83.conf (default: unix:/tmp/php-cgi-83.sock).
# The ^~ prefixes stop aaPanel's default static-file rules from catching the web app's .js/.png files.

location @laravel {
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}
location ^~ /api/     { try_files $uri @laravel; }
location ^~ /sanctum/ { try_files $uri @laravel; }
location ^~ /horizon  { try_files $uri @laravel; }
location = /up        { try_files $uri @laravel; }
location ^~ /.well-known/ { allow all; try_files $uri =404; }   # SSL certificate checks; aaPanel's own, more specific rule wins if it has one
location ^~ / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
