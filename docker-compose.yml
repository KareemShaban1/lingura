# Local development / single-host stack. Production uses managed Postgres/Redis/S3 (see docs/06-infrastructure.md).
x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?set APP_KEY (php artisan key:generate --show)}
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:3000
  SANCTUM_STATEFUL_DOMAINS: localhost:3000
  SESSION_DOMAIN: localhost
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_DATABASE: linguaforge
  DB_USERNAME: linguaforge
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MEDIA_DISK: s3
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minio-secret}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: linguaforge-private
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: http://localhost:9000/linguaforge-private
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOG_CHANNEL: stderr

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: linguaforge, POSTGRES_USER: linguaforge, POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U linguaforge"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-minio-secret}" }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  api:
    build: { context: ./backend, target: app }
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro", "./backend/public:/var/www/html/public:ro"]
    ports: ["8000:80"]
    depends_on: [api]

  horizon:
    build: { context: ./backend, target: app }
    command: ["php", "artisan", "horizon"]
    environment: *api-env
    depends_on: [api]

  scheduler:
    build: { context: ./backend, target: app }
    command: ["php", "artisan", "schedule:work"]
    environment: *api-env
    depends_on: [api]

  web:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [nginx]

volumes:
  pgdata:
  redisdata:
  miniodata:
