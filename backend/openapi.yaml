openapi: 3.1.0
info:
  title: LinguaForge API
  version: 5.0.0-phase5
  description: |
    REST API for the LinguaForge language-learning platform (identity, onboarding, placement, plans, content & practice, AI tutor, speech, writing, billing, family groups, gamification, administration, exam practice and offline sync).
    Authentication: Sanctum SPA cookies (call `GET /sanctum/csrf-cookie` first and send `X-XSRF-TOKEN`) or a bearer token
    (pass `device_name` to register/login). Errors use `{message, code?, errors?}`.
    Assessment results are estimates aligned to CEFR descriptors, never official certifications.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
  - name: Account
  - name: Catalog
  - name: Learner profiles
  - name: Assessment
  - name: Plans
  - name: Courses
  - name: Grammar
  - name: Practice
  - name: Vocabulary
  - name: Tutor
  - name: Speech
  - name: Writing
  - name: Billing
  - name: Family
  - name: Gamification
  - name: Admin
  - name: Exams
  - name: Offline
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, accept_terms]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
                native_language: { type: string, example: ar }
                interface_language: { type: string, enum: [en, ar] }
                timezone: { type: string, example: Africa/Cairo }
                accept_terms: { type: boolean }
                device_name: { type: string, description: When set, a bearer token is returned instead of a session. }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many attempts }
  /auth/logout:
    post: { tags: [Auth], responses: { '200': { description: Signed out } } }
  /auth/me:
    get:
      tags: [Auth]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { description: Unauthenticated }
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      description: Always returns the same response whether or not the account exists.
      requestBody: { content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { '200': { description: Accepted } }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties: { token: { type: string }, email: { type: string }, password: { type: string }, password_confirmation: { type: string } }
      responses: { '200': { description: Password reset }, '422': { $ref: '#/components/responses/ValidationError' } }
  /me/profile:
    patch:
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                native_language: { type: string, nullable: true }
                interface_language: { type: string, enum: [en, ar] }
                timezone: { type: string }
                country_code: { type: string, minLength: 2, maxLength: 2 }
      responses: { '200': { description: Updated user } }
  /me/preferences:
    patch:
      tags: [Account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: { type: string, enum: [light, dark, system] }
                daily_reminder_enabled: { type: boolean }
                reminder_time: { type: string, example: '19:30', nullable: true }
                marketing_opt_in: { type: boolean }
      responses: { '200': { description: Updated user } }
  /me/data-exports:
    get: { tags: [Account], responses: { '200': { description: Recent export requests } } }
    post: { tags: [Account], description: Queues a full personal-data export., responses: { '202': { description: Export requested } } }
  /me/data-exports/{export}/download:
    get:
      tags: [Account]
      parameters: [{ name: export, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: '{ url } — signed URL valid for 5 minutes' }, '410': { description: Expired } }
  /me:
    delete:
      tags: [Account]
      description: Anonymises the account immediately; learning data is purged after the grace period.
      requestBody: { content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
      responses: { '200': { description: Deleted }, '422': { $ref: '#/components/responses/ValidationError' } }
  /languages:
    get:
      tags: [Catalog]
      security: []
      responses: { '200': { description: Active languages with variants and capability matrix, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Language' } } } } } } } }
  /languages/{code}:
    get:
      tags: [Catalog]
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Language }, '404': { description: Not found } }
  /catalog/onboarding:
    get: { tags: [Catalog], security: [], responses: { '200': { description: 'languages, purposes, skills, levels, daily_minutes bounds' } } }
  /learner-profiles:
    get: { tags: [Learner profiles], responses: { '200': { description: My target languages } } }
    post:
      tags: [Learner profiles]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LearnerProfileInput' } } }
      responses:
        '201': { description: Created (an initial plan version is generated) }
        '409': { description: 'Already learning this language (code: profile_exists)' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /learner-profiles/{profile}:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Learner profiles], responses: { '200': { description: Profile }, '403': { description: Not yours } } }
    patch:
      tags: [Learner profiles]
      description: Changing purpose, daily minutes, target level, schedule or focus skills creates a new plan version.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LearnerProfileInput' } } } }
      responses: { '200': { description: Updated } }
    delete: { tags: [Learner profiles], responses: { '200': { description: Archived } } }
  /learner-profiles/{profile}/dashboard:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Learner profiles], responses: { '200': { description: 'Today items, streak, week minutes, skill levels, latest attempt' } } }
  /learner-profiles/{profile}/progress:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Learner profiles], responses: { '200': { description: 'Skill history, 12-week activity, practice by skill, assessment history' } } }
  /learner-profiles/{profile}/assessments:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post: { tags: [Assessment], description: Start (or resume) the placement attempt., responses: { '201': { description: Started }, '200': { description: Resumed existing attempt } } }
  /learner-profiles/{profile}/assessment-attempts:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Assessment], responses: { '200': { description: Attempt history } } }
  /assessment-attempts/{attempt}:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get: { tags: [Assessment], responses: { '200': { description: Attempt with per-section status } } }
  /assessment-attempts/{attempt}/next:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get:
      tags: [Assessment]
      description: Returns the adaptively selected item (stable across refreshes), or done=true when all sections are closed (the attempt is then finalised).
      responses:
        '200':
          description: Next item
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
                  item: { oneOf: [{ $ref: '#/components/schemas/AssessmentItem' }, { type: 'null' }] }
  /assessment-attempts/{attempt}/answers:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post:
      tags: [Assessment]
      description: Idempotent per (attempt, item). Only the currently served item is accepted. Correctness is not revealed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_id, option_id]
              properties: { item_id: { type: string }, option_id: { type: integer }, response_time_ms: { type: integer } }
      responses:
        '200': { description: '{ accepted: true }' }
        '409': { description: 'item_not_current | attempt_closed' }
        '422': { description: invalid_option }
  /assessment-attempts/{attempt}/sections/{skill}/skip:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: skill, in: path, required: true, schema: { type: string } }]
    post: { tags: [Assessment], responses: { '200': { description: Section skipped (not assessed) } } }
  /assessment-attempts/{attempt}/complete:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post: { tags: [Assessment], description: End now; sections with at least min_items answers are scored., responses: { '200': { description: Report } } }
  /assessment-attempts/{attempt}/report:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get:
      tags: [Assessment]
      responses:
        '200': { description: Report, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AssessmentReport' } } } } } }
        '409': { description: Attempt still in progress }
  /assessment-attempts/{attempt}/items/{item}/audio:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: item, in: path, required: true, schema: { type: string } }]
    get: { tags: [Assessment], description: Signed 5-minute URL for the current listening item., responses: { '200': { description: '{ url }' }, '404': { description: Not the current item } } }
  /learner-profiles/{profile}/plan:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Plans], responses: { '200': { description: Live plan with current version, rationale and allocations } } }
  /learner-profiles/{profile}/plan/items:
    parameters:
      - { $ref: '#/components/parameters/Profile' }
      - { name: from, in: query, schema: { type: string, format: date } }
      - { name: to, in: query, schema: { type: string, format: date } }
    get: { tags: [Plans], responses: { '200': { description: Items of the current version } } }
  /learner-profiles/{profile}/plan/versions:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Plans], responses: { '200': { description: Immutable version history } } }
  /learner-profiles/{profile}/plan/regenerate:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post: { tags: [Plans], responses: { '200': { description: New version } } }
  /learner-profiles/{profile}/plan/pause:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post: { tags: [Plans], responses: { '200': { description: Paused } } }
  /learner-profiles/{profile}/plan/resume:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post: { tags: [Plans], responses: { '200': { description: Resumed with a fresh week } } }
  /plan-items/{item}/start:
    parameters: [{ name: item, in: path, required: true, schema: { type: string } }]
    post: { tags: [Plans], responses: { '201': { description: Learning session }, '409': { description: 'plan_paused | item_superseded | item_finished' } } }
  /plan-items/{item}/skip:
    parameters: [{ name: item, in: path, required: true, schema: { type: string } }]
    post: { tags: [Plans], requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }, responses: { '200': { description: Skipped } } }
  /learning-sessions/{session}:
    parameters: [{ name: session, in: path, required: true, schema: { type: string } }]
    get: { tags: [Plans], responses: { '200': { description: Session with its plan item } } }
  /learning-sessions/{session}/complete:
    parameters: [{ name: session, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Plans]
      description: Credited time is capped at real elapsed time (+60 s) and 4 h.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [active_seconds], properties: { active_seconds: { type: integer }, self_rating: { type: integer, minimum: 1, maximum: 5 } } }
      responses: { '200': { description: Completed } }
  /learner-profiles/{profile}/learning-sessions:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post:
      tags: [Plans]
      requestBody: { content: { application/json: { schema: { type: object, required: [activity_type], properties: { activity_type: { type: string, enum: [lesson, exercise, vocabulary_review] } } } } } }
      responses: { '201': { description: Standalone learning session } }
  /learner-profiles/{profile}/courses:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Courses], responses: { '200': { description: 'Courses → units → lessons with progress; next_lesson_id' } } }
  /learner-profiles/{profile}/lessons/{lesson}:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: lesson, in: path, required: true, schema: { type: string } }]
    get: { tags: [Courses], responses: { '200': { description: 'Lesson detail: intro, objectives, grammar topic, words, exercises' } } }
  /learner-profiles/{profile}/lessons/{lesson}/complete:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: lesson, in: path, required: true, schema: { type: string } }]
    post: { tags: [Courses], responses: { '200': { description: Completed; lesson words added to flashcards }, '409': { description: lesson_incomplete } } }
  /learner-profiles/{profile}/grammar-topics:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Grammar], responses: { '200': { description: Topics with mastery } } }
  /learner-profiles/{profile}/grammar-topics/{slug}:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: slug, in: path, required: true, schema: { type: string } }]
    get: { tags: [Grammar], responses: { '200': { description: 'Explanation, examples, exercises, recent mistakes' } } }
  /learner-profiles/{profile}/exercises:
    parameters:
      - { $ref: '#/components/parameters/Profile' }
      - { name: skill, in: query, schema: { type: string } }
      - { name: level, in: query, schema: { type: string } }
      - { name: type, in: query, schema: { type: string, enum: [mcq, cloze, ordering, reading, listening, dictation] } }
    get: { tags: [Practice], responses: { '200': { description: Usable exercises in the profile language } } }
  /learner-profiles/{profile}/exercises/{exercise}/attempts:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: exercise, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Practice]
      requestBody: { content: { application/json: { schema: { type: object, properties: { lesson_id: { type: string }, session_id: { type: string } } } } } }
      responses: { '201': { description: Attempt started }, '200': { description: Open attempt resumed }, '409': { description: exercise_unavailable }, '422': { description: wrong_language } }
  /exercise-attempts/{attempt}:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get: { tags: [Practice], responses: { '200': { description: Attempt; answer keys only for answered questions } } }
  /exercise-attempts/{attempt}/answers:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post:
      tags: [Practice]
      description: Idempotent per question. Deterministic scoring with partial credit.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [question_id]
              properties: { question_id: { type: integer }, option_id: { type: integer }, text: { type: string }, order: { type: array, items: { type: integer } }, response_time_ms: { type: integer } }
      responses:
        '200':
          description: Feedback
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      is_correct: { type: boolean }
                      score: { type: number }
                      feedback_code: { type: [string, 'null'], enum: [check_accents, word_accuracy, empty, invalid_order, null] }
                      correct_answer: { type: [string, 'null'] }
                      explanation: { type: [string, 'null'] }
  /exercise-attempts/{attempt}/finish:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post:
      tags: [Practice]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reading_seconds: { type: integer } } } } } }
      responses: { '200': { description: 'Completed attempt: score, words_per_minute, transcript for listening' } }
  /exercise-attempts/{attempt}/audio:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: question_id, in: query, schema: { type: integer } }]
    get: { tags: [Practice], responses: { '200': { description: '{ url } signed for 5 minutes' } } }
  /learner-profiles/{profile}/vocabulary:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Vocabulary], parameters: [{ name: filter, in: query, schema: { type: string, enum: [all, due, learning, mastered] } }, { name: collection, in: query, schema: { type: integer } }], responses: { '200': { description: Deck (paginated) } } }
    post: { tags: [Vocabulary], requestBody: { content: { application/json: { schema: { type: object, required: [word_id], properties: { word_id: { type: integer }, source: { type: string }, collection_id: { type: integer } } } } } }, responses: { '201': { description: Added }, '200': { description: Already in deck } } }
  /learner-profiles/{profile}/vocabulary/summary:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Vocabulary], responses: { '200': { description: 'total, due_now, mastered, retention_30d …' } } }
  /learner-profiles/{profile}/vocabulary/review-queue:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: limit, in: query, schema: { type: integer, maximum: 100 } }]
    get: { tags: [Vocabulary], responses: { '200': { description: Due cards } } }
  /learner-profiles/{profile}/vocabulary/lookup:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: q, in: query, required: true, schema: { type: string } }]
    get: { tags: [Vocabulary], responses: { '200': { description: Matching words (lemma or inflected form) } } }
  /learner-profiles/{profile}/vocabulary/extract:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post: { tags: [Vocabulary], requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } } }, responses: { '200': { description: 'token → word (with in_deck)' } } }
  /user-vocabulary/{card}/reviews:
    parameters: [{ name: card, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Vocabulary], description: FSRS-4.5 review., requestBody: { content: { application/json: { schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 1, maximum: 4 }, duration_ms: { type: integer } } } } } }, responses: { '200': { description: Updated card schedule } } }
  /user-vocabulary/{card}:
    parameters: [{ name: card, in: path, required: true, schema: { type: integer } }]
    delete: { tags: [Vocabulary], responses: { '200': { description: Removed } } }
  /learner-profiles/{profile}/vocabulary-collections:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Vocabulary], responses: { '200': { description: Collections } } }
    post: { tags: [Vocabulary], requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }, responses: { '201': { description: Created } } }
  /vocabulary-collections/{collection}:
    parameters: [{ name: collection, in: path, required: true, schema: { type: integer } }]
    delete: { tags: [Vocabulary], responses: { '200': { description: Deleted } } }
  /vocabulary-collections/{collection}/items:
    parameters: [{ name: collection, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Vocabulary], requestBody: { content: { application/json: { schema: { type: object, required: [user_vocabulary_id], properties: { user_vocabulary_id: { type: integer } } } } } }, responses: { '200': { description: '{ attached }' } } }
  /learner-profiles/{profile}/tutor/catalog:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Tutor], responses: { '200': { description: 'tutors, scenarios, modes available for the language, remaining daily turns' } } }
  /learner-profiles/{profile}/conversations:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Tutor], responses: { '200': { description: Recent conversations } } }
    post:
      tags: [Tutor]
      description: Starts (or reuses an open) conversation. Realtime mode requires realtime capability for the language.
      requestBody: { content: { application/json: { schema: { type: object, required: [tutor, mode], properties: { tutor: { type: string }, scenario: { type: string }, level: { type: string }, mode: { type: string, enum: [text, voice, realtime] }, session_id: { type: string } } } } } }
      responses: { '201': { description: Conversation }, '422': { $ref: '#/components/responses/ValidationError' } }
  /conversations/{conversation}:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    get: { tags: [Tutor], responses: { '200': { description: Conversation with messages and corrections } } }
  /conversations/{conversation}/messages:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post:
      tags: [Tutor]
      description: One tutor turn. Corrections are kept only when they quote the learner's own text. Daily turn cap applies (429 `quota_exceeded`).
      requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 }, response_ms: { type: integer } } } } } }
      responses: { '200': { description: '{ learner_message, tutor_message, corrections[] }' }, '429': { description: Rate or daily limit reached } }
  /conversations/{conversation}/voice:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post: { tags: [Tutor], requestBody: { content: { application/json: { schema: { type: object, required: [recording_id], properties: { recording_id: { type: string }, response_ms: { type: integer } } } } } }, responses: { '200': { description: Transcribed turn (same shape as messages) } } }
  /conversations/{conversation}/realtime-session:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post: { tags: [Tutor], description: Short-lived client secret for a browser WebRTC session. Never returns a permanent API key., responses: { '200': { description: '{ client_secret, expires_at, model, provider }' } } }
  /conversations/{conversation}/realtime-transcript:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post: { tags: [Tutor], requestBody: { content: { application/json: { schema: { type: object, required: [role, text], properties: { role: { type: string, enum: [learner, assistant] }, text: { type: string, maxLength: 2000 } } } } } }, responses: { '201': { description: Stored } } }
  /conversations/{conversation}/finish:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post: { tags: [Tutor], requestBody: { content: { application/json: { schema: { type: object, required: [active_seconds], properties: { active_seconds: { type: integer, maximum: 86400 } } } } } }, responses: { '200': { description: Finished; report queued } } }
  /conversations/{conversation}/report:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    get: { tags: [Tutor], responses: { '200': { description: 'Report with status pending | ready | failed; labelled as AI feedback, not an official assessment' } } }
  /conversations/{conversation}/report/retry:
    parameters: [{ $ref: '#/components/parameters/Conversation' }]
    post: { tags: [Tutor], responses: { '202': { description: Requeued } } }
  /ai-messages/{message}/audio:
    parameters: [{ name: message, in: path, required: true, schema: { type: string } }]
    get: { tags: [Tutor], responses: { '200': { description: '{ url } signed TTS audio for a tutor message' } } }
  /learner-profiles/{profile}/recordings:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post:
      tags: [Speech]
      description: Learner audio. Max 4 MB / 120 s; MIME type is sniffed from the bytes (webm, ogg, mp4, mpeg, wav). Stored privately.
      requestBody: { content: { multipart/form-data: { schema: { type: object, required: [audio, purpose], properties: { audio: { type: string, format: binary }, purpose: { type: string, enum: [conversation, pronunciation, speaking_assessment] }, duration_ms: { type: integer } } } } } }
      responses: { '201': { description: '{ id, duration_ms, mime }' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /recordings/{recording}/url:
    parameters: [{ name: recording, in: path, required: true, schema: { type: string } }]
    get: { tags: [Speech], responses: { '200': { description: '{ url } signed for 5 minutes (owner only)' } } }
  /learner-profiles/{profile}/writing-tasks:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Writing], responses: { '200': { description: Writing tasks for the profile language and level } } }
  /learner-profiles/{profile}/writing-tasks/{task}:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: task, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Writing], responses: { '200': { description: Task with previous submissions } } }
  /learner-profiles/{profile}/writing-tasks/{task}/submissions:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: task, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Writing], requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 5000 } } } } } }, responses: { '202': { description: Submission (evaluation queued) } } }
  /writing-submissions/{submission}:
    parameters: [{ name: submission, in: path, required: true, schema: { type: string } }]
    get: { tags: [Writing], responses: { '200': { description: 'Submission with evaluation: criteria (1–5), estimated level, span-anchored corrections, corrected text' } } }
  /assessment-attempts/{attempt}/writing:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post: { tags: [Assessment], requestBody: { content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 5000 } } } } } }, responses: { '200': { description: Section scored by rubric; returns attempt state } } }
  /assessment-attempts/{attempt}/speaking:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post: { tags: [Assessment], requestBody: { content: { application/json: { schema: { type: object, required: [recording_id], properties: { recording_id: { type: string } } } } } }, responses: { '200': { description: Section scored by rubric from the transcript } } }
  /billing/plans:
    get: { tags: [Billing], security: [], responses: { '200': { description: 'Active public plans with limits (null = unlimited); meta.checkout_available' } } }
  /billing/subscription:
    get: { tags: [Billing], responses: { '200': { description: 'Effective plan, source (free|personal|organization), subscription, usage per feature' } } }
  /billing/checkout:
    post: { tags: [Billing], requestBody: { content: { application/json: { schema: { type: object, required: [plan], properties: { plan: { type: string } } } } } }, responses: { '200': { description: '{ url } of the provider-hosted checkout' }, '409': { description: already_subscribed } } }
  /billing/checkout/confirm:
    post: { tags: [Billing], description: Completes a test-mode session; paid sessions are confirmed by webhook and return pending., requestBody: { content: { application/json: { schema: { type: object, required: [session_id], properties: { session_id: { type: string } } } } } }, responses: { '200': { description: '{ status }' } } }
  /billing/subscription/cancel:
    post: { tags: [Billing], description: Cancel at the end of the current period., responses: { '200': { description: Updated billing state } } }
  /billing/subscription/resume:
    post: { tags: [Billing], responses: { '200': { description: Updated billing state } } }
  /billing/portal:
    post: { tags: [Billing], responses: { '200': { description: '{ url } of the provider portal' }, '404': { description: portal_unavailable } } }
  /billing/payments:
    get: { tags: [Billing], responses: { '200': { description: Payment history } } }
  /webhooks/billing:
    post: { tags: [Billing], security: [], description: 'Provider webhook. Verified with the Stripe-Signature header (HMAC-SHA256, 5-minute tolerance); idempotent per event id; subscription state is re-fetched from the provider.', responses: { '200': { description: '{ received, result: processed|duplicate|ignored }' }, '400': { description: Invalid signature } } }
  /me/notifications:
    get: { tags: [Account], responses: { '200': { description: 'Latest notifications { id, data: { kind, … }, read }; meta.unread' } } }
  /me/notifications/read:
    post: { tags: [Account], responses: { '200': { description: All marked read } } }
  /organizations:
    get: { tags: [Family], responses: { '200': { description: My groups and role } } }
    post: { tags: [Family], requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }, responses: { '201': { description: Group }, '409': { description: organization_exists } } }
  /organizations/{organization}:
    parameters: [{ name: organization, in: path, required: true, schema: { type: string } }]
    get: { tags: [Family], description: Members see names only; emails and pending invitations only for group admins., responses: { '200': { description: 'Group with seats, members, invitations' }, '404': { description: Not a member } } }
    patch: { tags: [Family], requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }, responses: { '200': { description: Group } } }
  /organizations/{organization}/invitations:
    parameters: [{ name: organization, in: path, required: true, schema: { type: string } }]
    post: { tags: [Family], requestBody: { content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, role: { type: string, enum: [member, admin] } } } } } }, responses: { '201': { description: 'Invitation with shareable accept_url (works only for that email)' }, '402': { description: plan_required }, '409': { description: seats_exhausted } } }
  /organization-invitations/{invitation}:
    parameters: [{ name: invitation, in: path, required: true, schema: { type: string } }]
    delete: { tags: [Family], responses: { '200': { description: Revoked } } }
  /invitations/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get: { tags: [Family], responses: { '200': { description: 'organization, invited_by, status, email_matches' }, '404': { description: invitation_invalid } } }
  /invitations/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post: { tags: [Family], responses: { '200': { description: Group }, '403': { description: invitation_email_mismatch }, '410': { description: invitation_expired } } }
  /organizations/{organization}/members/{member}:
    parameters: [{ name: organization, in: path, required: true, schema: { type: string } }, { name: member, in: path, required: true, schema: { type: integer } }]
    delete: { tags: [Family], responses: { '200': { description: Group } } }
  /organizations/{organization}/leave:
    parameters: [{ name: organization, in: path, required: true, schema: { type: string } }]
    post: { tags: [Family], responses: { '200': { description: Left } } }
  /me/gamification:
    get: { tags: [Gamification], responses: { '200': { description: 'xp_total, xp_today, xp_week, streak (current, longest, freezes, active_today, at_risk), achievements counts, leaderboard_opt_in' } } }
  /me/xp:
    get: { tags: [Gamification], responses: { '200': { description: 30-day XP by day and source; streak days (active|frozen) } } }
  /me/achievements:
    get: { tags: [Gamification], responses: { '200': { description: Achievements with progress and unlock dates } } }
  /me/challenges:
    get: { tags: [Gamification], responses: { '200': { description: This week's challenges with progress } } }
  /leaderboards/weekly:
    get: { tags: [Gamification], description: Only learners who opted in; alias or first name + initial., responses: { '200': { description: 'entries, you' } } }
  /me/leaderboard:
    patch: { tags: [Gamification], requestBody: { content: { application/json: { schema: { type: object, required: [opt_in], properties: { opt_in: { type: boolean }, alias: { type: string, maxLength: 40 } } } } } }, responses: { '200': { description: Gamification summary } } }
  /admin/analytics/overview:
    get: { tags: [Admin], description: 'Permission analytics.view.', responses: { '200': { description: 'users, subscriptions (MRR), engagement_7d, ai_cost_30d, retention cohorts' }, '403': { description: forbidden } } }
  /admin/users:
    get: { tags: [Admin], description: 'Permission users.manage. Other admin routes (users/{id}, status, roles, grants, review, content, ai, billing, languages, audit-logs) are documented in docs/13-business-and-admin.md §5.', responses: { '200': { description: Paginated users } } }
  /learner-profiles/{profile}/exams:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    get: { tags: [Exams], responses: { '200': { description: 'Exam practice for the profile language: sections, disclaimer, past attempts with overall estimates' } } }
  /learner-profiles/{profile}/exams/{framework}/attempts:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: framework, in: path, required: true, schema: { type: string, enum: [ielts_academic, dele_a2, delf_a2, goethe_a2, hsk_1] } }]
    post: { tags: [Exams], description: Starts a practice test (quota exam_mocks) or resumes the open one., responses: { '201': { description: New attempt }, '200': { description: Resumed attempt }, '429': { description: quota_exceeded } } }
  /exam-attempts/{attempt}:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get: { tags: [Exams], description: 'Sweeps sections whose server deadline has passed. The current section returns questions without keys (listening without scripts) or the writing/speaking task.', responses: { '200': { description: 'Attempt with sections (status, deadline_at, remaining_seconds, raw, level, estimate), current, result' } } }
  /exam-attempts/{attempt}/sections/{skill}/start:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: skill, in: path, required: true, schema: { type: string, enum: [listening, reading, writing, speaking] } }]
    post: { tags: [Exams], responses: { '200': { description: Section started; deadline set server-side }, '409': { description: section_in_progress | section_closed } } }
  /exam-attempts/{attempt}/sections/{skill}/skip:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: skill, in: path, required: true, schema: { type: string, enum: [listening, reading, writing, speaking] } }]
    post: { tags: [Exams], responses: { '200': { description: Section skipped (no estimate) } } }
  /exam-attempts/{attempt}/answers:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    post: { tags: [Exams], requestBody: { content: { application/json: { schema: { type: object, required: [item_id, option_id], properties: { item_id: { type: string }, option_id: { type: integer } } } } } }, responses: { '200': { description: Saved (correctness only in the review) }, '409': { description: section_time_over | section_closed } } }
  /exam-attempts/{attempt}/sections/{skill}/submit:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: skill, in: path, required: true, schema: { type: string, enum: [listening, reading, writing, speaking] } }]
    post: { tags: [Exams], requestBody: { content: { application/json: { schema: { type: object, properties: { text: { type: string, maxLength: 8000 }, recording_id: { type: string } } } } } }, responses: { '200': { description: 'Section closed with an estimate: band {band, low, high} or readiness {probability, label}' } } }
  /exam-attempts/{attempt}/review:
    parameters: [{ $ref: '#/components/parameters/Attempt' }]
    get: { tags: [Exams], responses: { '200': { description: Questions with keys, chosen options, explanations and listening scripts }, '409': { description: Test not finished } } }
  /exam-attempts/{attempt}/items/{item}/audio:
    parameters: [{ $ref: '#/components/parameters/Attempt' }, { name: item, in: path, required: true, schema: { type: string } }]
    get: { tags: [Exams], responses: { '200': { description: '{ url } signed, only while the section is open' } } }
  /learner-profiles/{profile}/lessons/{lesson}/offline-pack:
    parameters: [{ $ref: '#/components/parameters/Profile' }, { name: lesson, in: path, required: true, schema: { type: string } }]
    get: { tags: [Offline], description: Text exercises with answer keys for provisional on-device feedback; never cached by intermediaries., responses: { '200': { description: 'lesson, language, exercises, version, expires_at, skipped_exercises' } } }
  /learner-profiles/{profile}/offline-sync:
    parameters: [{ $ref: '#/components/parameters/Profile' }]
    post:
      tags: [Offline]
      description: Replays offline attempts through the normal exercise service (answers re-checked server-side). Idempotent per client_ref.
      requestBody: { content: { application/json: { schema: { type: object, required: [attempts], properties: { attempts: { type: array, maxItems: 50, items: { type: object, required: [client_ref, exercise_id, answers], properties: { client_ref: { type: string }, exercise_id: { type: string }, lesson_id: { type: string }, answers: { type: array } } } }, complete_lessons: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: 'Per attempt: synced | duplicate | rejected, with the server score' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: linguaforge_session }
  parameters:
    Profile: { name: profile, in: path, required: true, schema: { type: string, description: ULID } }
    Attempt: { name: attempt, in: path, required: true, schema: { type: string, description: ULID } }
    Conversation: { name: conversation, in: path, required: true, schema: { type: string, description: ULID } }
  responses:
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { type: object, properties: { message: { type: string }, errors: { type: object, additionalProperties: { type: array, items: { type: string } } } } } } }
  schemas:
    AuthResponse:
      type: object
      properties: { user: { $ref: '#/components/schemas/User' }, token: { type: string, description: Only for token clients } }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        is_staff: { type: boolean }
        profile: { type: object, properties: { native_language: { type: string }, interface_language: { type: string }, interface_direction: { type: string, enum: [ltr, rtl] }, timezone: { type: string } } }
        preferences: { type: object }
        learner_profiles: { type: array, items: { $ref: '#/components/schemas/LearnerProfile' } }
        features: { type: array, items: { type: string } }
    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        native_name: { type: string }
        direction: { type: string, enum: [ltr, rtl] }
        variants: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string }, is_default: { type: boolean } } } }
        capabilities: { type: object, additionalProperties: { type: object, properties: { status: { type: string, enum: [supported, beta, unsupported] }, quality_tier: { type: integer } } } }
    LearnerProfileInput:
      type: object
      properties:
        target_language: { type: string }
        variant: { type: string }
        purpose: { type: string, enum: [general, career, travel, academic, immigration, exams, personal] }
        self_reported_level: { type: string, enum: [PRE_A1, A1, A2, B1, B2, C1, C2] }
        target_level: { type: string }
        daily_minutes: { type: integer, minimum: 10, maximum: 240 }
        focus_skills: { type: array, items: { type: string, enum: [listening, speaking, reading, writing, grammar, vocabulary] } }
        schedule: { type: array, items: { type: object, properties: { day: { type: integer, minimum: 0, maximum: 6 }, time: { type: string } } } }
        preferences: { type: object, additionalProperties: { type: string } }
    LearnerProfile:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [assessment_pending, active, archived] }
        target_language: { type: object }
        daily_minutes: { type: integer }
    AssessmentItem:
      type: object
      description: Never contains the answer key, difficulty or explanation.
      properties:
        id: { type: string }
        skill: { type: string }
        format: { type: string }
        stimulus: { type: [string, 'null'] }
        has_audio: { type: boolean }
        prompt: { type: string }
        options: { type: array, items: { type: object, properties: { id: { type: integer }, label: { type: string } } } }
    AssessmentReport:
      type: object
      properties:
        is_official: { type: boolean, const: false }
        disclaimer: { type: string }
        overall: { type: object, properties: { level: { type: object }, is_provisional: { type: boolean }, provisional_reasons: { type: array, items: { type: string } }, method: { type: string, const: lower_median_of_assessed_skills } } }
        skills: { type: array, items: { type: object, properties: { skill: { type: string }, status: { type: string }, level: { type: object }, confidence: { type: string }, scaled_score: { type: integer }, items_answered: { type: integer } } } }
        findings: { type: array, items: { type: object, properties: { type: { type: string, enum: [strength, weakness, recommendation] }, code: { type: string }, skill: { type: string }, detail: { type: string } } } }
